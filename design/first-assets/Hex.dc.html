<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hex tile</title>

<body>

<sc-if value="{{grid}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 256 222" style="position: absolute; left: 0; top: 0; display: block; width: {{w}}px; height: {{h}}px" aria-hidden="true">
<polygon points="64,0 192,0 256,111 192,222 64,222 0,111" fill="none" stroke="#3B2A20" stroke-opacity="0.16" stroke-width="2"></polygon>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["coast","grassland","forest","marsh","mountains","water"],"default":"grassland"},"size":{"editor":"int","default":256,"min":32,"max":512,"unit":"px"},"grid":{"editor":"boolean","default":false},"$preview":{"width":256,"height":222}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'grassland';
    const w = Number(this.props.size ?? 256);
    return {
      w, h: Math.round(w * 222 / 256 * 100) / 100,
      grid: !!this.props.grid,
      is: {
        coast: kind === 'coast', grassland: kind === 'grassland', forest: kind === 'forest',
        marsh: kind === 'marsh', mountains: kind === 'mountains', water: kind === 'water'
      }
    };
  }
}
</script>
</body>
</html>
