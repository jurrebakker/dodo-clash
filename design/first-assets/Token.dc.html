<sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 50%; bottom: {{bb}}px; transform: translateX(-50%); min-width: {{bmw}}px; height: {{bh}}px; box-sizing: border-box; padding: 0 5px; display: flex; align-items: center; justify-content: center; background: #FBF5E6; border: {{bbw}}px solid #3B2A20; border-radius: 999px; font-weight: 700; font-size: {{bf}}px; line-height: 1; color: #3B2A20">{{strength}}</span>
</sc-if>

<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["dodo-forest","dodo-marsh","dodo-highland","dodo-shore","tortoise","sailor","pig","rat","none"],"default":"dodo-forest"},"frame":{"editor":"enum","options":["dodo","invader","none"],"default":"dodo"},"ring":{"editor":"color","default":"#0072B2","options":["#0072B2","#56B4E9","#F0E442","#CC79A7"]},"strength":{"editor":"int","default":0,"min":0,"max":999},"size":{"editor":"int","default":128,"min":24,"max":256,"unit":"px"},"$preview":{"width":128,"height":128}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'dodo-forest';
    const frame = this.props.frame ?? 'dodo';
    const s = Number(this.props.size ?? 128);
    const strength = Number(this.props.strength ?? 0);
    const dodos = {
      'dodo-forest': { bg: '#CFE3B8', body: '#9AA3A8', wing: '#7E878C', tf: 'translate(-4 2)' },
      'dodo-marsh': { bg: '#DCD5B2', body: '#949C98', wing: '#78807B', tf: 'translate(-8 2) scale(1.04 1)' },
      'dodo-highland': { bg: '#D5D8DD', body: '#80868C', wing: '#666C72', tf: 'translate(-10 -2) scale(1.06)' },
      'dodo-shore': { bg: '#F1E3BE', body: '#B3AEA2', wing: '#958F82', tf: 'translate(2 8) scale(0.92)' }
    };
    const bgs = { tortoise: '#D8E2C4', sailor: '#EADFCF', pig: '#E9D8C8', rat: '#E3DDD5' };
    const d = dodos[kind] || dodos['dodo-forest'];
    return {
      s, strength, ring: this.props.ring ?? '#0072B2',
      bg: dodos[kind] ? d.bg : (bgs[kind] || 'transparent'),
      body: d.body, wing: d.wing, tf: d.tf,
      hasPortrait: kind !== 'none', isDodo: !!dodos[kind],
      is: {
        forest: kind === 'dodo-forest', marsh: kind === 'dodo-marsh', highland: kind === 'dodo-highland', shore: kind === 'dodo-shore',
        tortoise: kind === 'tortoise', sailor: kind === 'sailor', pig: kind === 'pig', rat: kind === 'rat'
      },
      frameDodo: frame === 'dodo', frameInvader: frame === 'invader',
      hasBadge: strength > 0,
      bb: Math.round(-s * 0.1), bh: Math.max(18, Math.round(s * 0.25)), bmw: Math.round(s * 0.42),
      bf: Math.max(12, Math.round(s * 0.19)), bbw: Math.max(2, Math.round(s * 0.025))
    };
  }
}
</script>
</body>
</html>
