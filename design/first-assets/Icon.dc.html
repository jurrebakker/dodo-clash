<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; width: {{s}}px; height: {{s}}px; color: {{color}}">

<sc-if value="{{is.fruit}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="12" cy="14.5" r="6.5"></circle>
<path d="M12 8 C12 6 12.5 4.5 14 3.5"></path>
<path d="M13.5 6 C15 4 18.5 4 20 5.5 C18.5 7.5 15.5 7.5 13.5 6 Z"></path>
</svg>
</sc-if>

<sc-if value="{{is.courage}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M19.5 3.5 C11.5 4 6.5 9.5 6.5 16.5"></path>
<path d="M19.5 3.5 C19.5 11.5 14 16.5 6.5 16.5"></path>
<path d="M6.5 16.5 L4 21"></path>
<path d="M10.5 12.5 L14.5 11.5 M9 15 L12.5 14.5"></path>
</svg>
</sc-if>

<sc-if value="{{is.egg}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M12 3 C8 3 5 9 5 14 C5 18 8 21 12 21 C16 21 19 18 19 14 C19 9 16 3 12 3 Z"></path>
<path d="M9 11 C9.5 9.5 10 8.5 11 7.5"></path>
</svg>
</sc-if>

<sc-if value="{{is.dodo}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M5 16 C4.5 12 7 9.5 10.5 9.5 C12 9.5 13 9 13.5 8 L16 10 C17 11.5 17.5 13 17 15.5 C16.5 18.5 13.5 19.5 10.5 19.5 C7.5 19.5 5.5 18.5 5 16 Z"></path>
<circle cx="15.5" cy="6" r="2.5"></circle>
<path d="M18 5 C20.5 5 21.5 6.5 21 8 L18.5 7.5"></path>
<path d="M5 13.5 C3.5 13 2.5 11.5 3 10"></path>
<path d="M9.5 19.5 V21.5 M13 19.5 V21.5"></path>
</svg>
</sc-if>

<sc-if value="{{is.clockRunning}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="12" cy="13" r="8"></circle>
<path d="M12 9 V13 L15 15"></path>
<path d="M9.5 2.5 H14.5"></path>
<path d="M19 5 L20.5 6.5"></path>
</svg>
</sc-if>

<sc-if value="{{is.clockPaused}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="12" cy="13" r="8"></circle>
<path d="M10 10 V16 M14 10 V16"></path>
<path d="M9.5 2.5 H14.5"></path>
</svg>
</sc-if>

<sc-if value="{{is.inbox}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M3 13 L6 5 H18 L21 13 V19 H3 Z"></path>
<path d="M3 13 H8 L9.5 15.5 H14.5 L16 13 H21"></path>
</svg>
</sc-if>

<sc-if value="{{is.train}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M9 5 C6.5 5 4 9.5 4 13.5 C4 17 6.2 19.5 9 19.5 C11.8 19.5 14 17 14 13.5 C14 9.5 11.5 5 9 5 Z"></path>
<path d="M18.5 8 V15 M15 11.5 H22"></path>
</svg>
</sc-if>

<sc-if value="{{is.merge}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M5 3 C5 9 12 9 12 13 V20.5"></path>
<path d="M19 3 C19 9 12 9 12 13"></path>
<path d="M8.5 17 L12 20.5 L15.5 17"></path>
</svg>
</sc-if>

<sc-if value="{{is.split}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" style="display: block; width: {{s}}px; height: {{s}}px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M12 3 V9 C12 13 5 13 5 20.5"></path>
<path d="M12 9 C12 13 19 13 19 20.5"></path>
<path d="M2.5 18 L5 20.5 L7.5 18 M16.5 18 L19 20.5 L21.5 18"></path>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","options":["fruit","courage","egg","dodo","clock-running","clock-paused","inbox","train","merge","split"],"default":"fruit"},"size":{"editor":"int","default":48,"min":12,"max":192,"unit":"px"},"color":{"editor":"color","default":"#3B2A20"},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const n = this.props.icon ?? 'fruit';
    return {
      s: Number(this.props.size ?? 48),
      color: this.props.color ?? '#3B2A20',
      is: {
        fruit: n === 'fruit', courage: n === 'courage', egg: n === 'egg', dodo: n === 'dodo',
        clockRunning: n === 'clock-running', clockPaused: n === 'clock-paused', inbox: n === 'inbox',
        train: n === 'train', merge: n === 'merge', split: n === 'split'
      }
    };
  }
}
</script>
</body>
</html>
