<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["colony","colony-wild","ruin","harbour","settlement-tortoise","den-pig","den-rat","den-sailor"],"default":"colony"},"size":{"editor":"int","default":128,"min":24,"max":256,"unit":"px"},"$preview":{"width":128,"height":128}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'colony';
    return {
      s: Number(this.props.size ?? 128),
      is: {
        colony: k === 'colony', colonyWild: k === 'colony-wild', ruin: k === 'ruin', harbour: k === 'harbour',
        tortoise: k === 'settlement-tortoise', denPig: k === 'den-pig', denRat: k === 'den-rat', denSailor: k === 'den-sailor'
      }
    };
  }
}
</script>
