<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marker and path sprite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px">

<sc-if value="{{is.battle}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 64 64" style="position: absolute; left: 0; top: 0; display: block; width: {{w}}px; height: {{h}}px" aria-hidden="true">
<polygon points="32,3 38,14 50,8 48,21 61,24 51,32 61,40 48,43 50,56 38,50 32,61 26,50 14,56 16,43 3,40 13,32 3,24 16,21 14,8 26,14" fill="#F4C531" stroke="#3B2A20" stroke-width="3" stroke-linejoin="round"></polygon>
<path d="M12 20 C22 16 34 22 36 32 C32 31 29 31 27 34 C21 31 15 27 12 20 Z" fill="#E6CF7A" stroke="#3B2A20" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="M32 30 C36 31 37 35 34 37 L32 33 Z" fill="#3B2A20"></path>
<ellipse cx="41" cy="40" rx="10" ry="8" fill="#E7A99A" stroke="#3B2A20" stroke-width="2.5" transform="rotate(-25 41 40)"></ellipse>
<ellipse cx="38" cy="41" rx="1.6" ry="2.4" fill="#3B2A20" transform="rotate(-25 38 41)"></ellipse>
<ellipse cx="44" cy="38.5" rx="1.6" ry="2.4" fill="#3B2A20" transform="rotate(-25 44 38.5)"></ellipse>
<path d="M30 46 l-3 5 M24 44 l-5 3 M44 22 l3 -5 M50 26 l5 -2" stroke="#3B2A20" stroke-width="2.5" stroke-linecap="round"></path>
</svg>
</sc-if>

<sc-if value="{{is.flee}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 64 64" style="position: absolute; left: 0; top: 0; display: block; width: {{w}}px; height: {{h}}px" aria-hidden="true">
<g fill="#E3D3B0" stroke="#3B2A20" stroke-width="3">
<circle cx="40" cy="46" r="10"></circle>
<circle cx="52" cy="42" r="8"></circle>
<circle cx="28" cy="50" r="8"></circle>
<circle cx="46" cy="34" r="7"></circle>
</g>
<path d="M36 44 C40 40 46 40 48 44" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
<path d="M44 20 C34 12 20 14 14 26" stroke="#3B2A20" stroke-width="4.5" fill="none" stroke-linecap="round"></path>
<path d="M8 18 L13 29 L24 25" stroke="#3B2A20" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M54 22 l6 -2 M56 30 l6 0" stroke="#3B2A20" stroke-width="2.5" stroke-linecap="round"></path>
</svg>
</sc-if>

<sc-if value="{{is.badge}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 64 32" style="position: absolute; left: 0; top: 0; display: block; width: {{w}}px; height: {{h}}px" aria-hidden="true">
<rect x="2" y="2" width="60" height="28" rx="14" fill="#FBF5E6" stroke="#3B2A20" stroke-width="3"></rect>
<path d="M10 9 C14 6 20 6 24 6" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
</svg>
</sc-if>

<sc-if value="{{is.footpath}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 256 32" style="position: absolute; left: 0; top: 0; display: block; width: {{w}}px; height: {{h}}px" aria-hidden="true">
<path d="M0 9 C30 6 50 11 80 8 C110 6 140 11 170 8 C200 6 230 10 256 9 L256 23 C226 26 200 21 170 24 C140 26 110 21 80 24 C50 26 30 22 0 23 Z" fill="#CDB688" opacity="0.9"></path>
<g stroke="#9C8458" stroke-width="2" stroke-linecap="round">
<path d="M30 14 l-3 -3 M30 14 l0 -4 M30 14 l3 -3"></path>
<path d="M62 20 l-3 -3 M62 20 l0 -4 M62 20 l3 -3"></path>
<path d="M94 14 l-3 -3 M94 14 l0 -4 M94 14 l3 -3"></path>
<path d="M126 20 l-3 -3 M126 20 l0 -4 M126 20 l3 -3"></path>
<path d="M158 14 l-3 -3 M158 14 l0 -4 M158 14 l3 -3"></path>
<path d="M190 20 l-3 -3 M190 20 l0 -4 M190 20 l3 -3"></path>
<path d="M222 14 l-3 -3 M222 14 l0 -4 M222 14 l3 -3"></path>
</g>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["battle","flee","badge","footpath"],"default":"battle"},"size":{"editor":"int","default":64,"min":16,"max":512,"unit":"px"},"$preview":{"width":64,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'battle';
    const w = Number(this.props.size ?? 64);
    const ratio = { battle: 1, flee: 1, badge: 0.5, footpath: 0.125 }[kind] ?? 1;
    return {
      w, h: w * ratio,
      is: { battle: kind === 'battle', flee: kind === 'flee', badge: kind === 'badge', footpath: kind === 'footpath' }
    };
  }
}
</script>
</body>
</html>
